name: Automatic cPanel Deployment

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🛠️ Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: https://periyaruniversity.site/backend/api
        run: |
          cd frontend
          npm run build

      - name: 📂 Prepare Deployment Package (.next folder & configs)
        run: |
          mkdir -p deploy_package
          cp -r frontend/.next deploy_package/
          cp frontend/package.json deploy_package/
          cp frontend/next.config.mjs deploy_package/
          mkdir -p deploy_package/tmp
          touch deploy_package/tmp/restart.txt

      - name: 🚀 Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_package/
          server-dir: /home/periyar/nodeapp/
          dangerous-clean-slate: false
          exclude: |
            **/node_modules/**
            **/.git*
            **/.git*/**

      - name: 🔄 Trigger cPanel Passenger Node.js App Restart
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_package/tmp/
          server-dir: /home/periyar/nodeapp/tmp/
